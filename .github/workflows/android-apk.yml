name: Build Android APK

on:
  push:
    paths:
      - 'docs/**'
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LieDetector.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LieDetector-apk
          path: LieDetector.apk

      # 폰에서 바로 받을 수 있게 Releases에 최신 APK 올리기
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest -y --cleanup-tag || true
          gh release create apk-latest LieDetector.apk \
            --target "$GITHUB_SHA" \
            --title "거짓말탐지기 APK (최신)" \
            --notes "폰에서 LieDetector.apk 를 눌러 다운로드 → 설치하세요." \
            --prerelease
